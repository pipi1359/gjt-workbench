<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>购机通 · 团队工作台</title>
<style>
:root{
  --bg:#0b1220;
  --bg2:#0d1526;
  --panel:#111a2e;
  --card:#131f36;
  --card2:#16243f;
  --line:#22304a;
  --txt:#e7edf8;
  --sub:#93a5c4;
  --dim:#5f7194;
  --blue:#3b82f6;
  --blue2:#60a5fa;
  --orange:#f97316;
  --green:#22c55e;
  --red:#ef4444;
  --purple:#a78bfa;
  --cyan:#22d3ee;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --tab-h:58px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--txt);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
/* ===== 应用外壳 ===== */
#app{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto;position:relative}
/* 顶部 */
.app-header{
  flex:0 0 auto;
  padding:calc(var(--safe-top) + 10px) 16px 10px;
  background:linear-gradient(180deg,#0e1730 0%,var(--bg) 100%);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;z-index:20;
}
.brand-mark{
  width:38px;height:38px;border-radius:11px;flex:0 0 auto;
  background:linear-gradient(135deg,#3b82f6,#2563eb);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(59,130,246,.35);
}
.brand-mark svg{width:22px;height:22px}
.app-header .brand-text{display:flex;flex-direction:column;min-width:0}
.app-header h1{font-size:17px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.app-header .sub{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-spacer{flex:1}
.header-badge{
  flex:0 0 auto;font-size:10px;color:#9ecbff;background:rgba(59,130,246,.12);
  border:1px solid rgba(59,130,246,.3);padding:4px 8px;border-radius:20px;white-space:nowrap;
}
/* 内容滚动区 */
.app-main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:14px 14px calc(var(--safe-bottom) + var(--tab-h) + 16px);-webkit-overflow-scrolling:touch}
/* 底部导航 */
.app-tabbar{
  position:absolute;left:0;right:0;bottom:0;z-index:30;
  height:calc(var(--tab-h) + var(--safe-bottom));
  padding-bottom:var(--safe-bottom);
  background:rgba(13,21,38,.96);
  backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  display:flex;
}
.tab-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--dim);font-size:10.5px;cursor:pointer;position:relative;
  transition:color .2s;
}
.tab-item svg{width:22px;height:22px}
.tab-item.active{color:var(--blue2)}
.tab-item.active::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:34px;height:3px;border-radius:0 0 3px 3px;background:var(--blue);
}
/* ===== 视图 ===== */
.view{display:none}
.view.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.section-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin:20px 2px 10px}
.section-title:first-child{margin-top:2px}
.section-title .bar{width:3.5px;height:15px;border-radius:2px;background:linear-gradient(180deg,var(--blue),var(--orange))}
.section-title .more{margin-left:auto;font-size:11px;color:var(--dim);font-weight:400;display:flex;align-items:center;gap:2px;cursor:pointer}
/* 卡片 */
.card{
  background:linear-gradient(180deg,var(--card) 0%,#101a2e 100%);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  cursor:pointer;
  transition:border-color .2s,transform .15s;
}
.card:active{transform:scale(.98);border-color:var(--blue)}
.card h3{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .tag{font-size:9.5px;font-weight:500;color:#9ecbff;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.3);padding:2px 7px;border-radius:10px}
.card p{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.6}
/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.kpi{
  background:linear-gradient(180deg,var(--card) 0%,#0f1930 100%);
  border:1px solid var(--line);border-radius:13px;padding:12px 10px;
  position:relative;overflow:hidden;
}
.kpi::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--kpi-c,var(--blue))}
.kpi .num{font-size:20px;font-weight:800;letter-spacing:.2px;font-variant-numeric:tabular-nums}
.kpi .lab{font-size:10.5px;color:var(--sub);margin-top:2px;display:flex;align-items:center;gap:4px}
.kpi .lab svg{width:12px;height:12px}
.kpi .delta{font-size:9.5px;margin-left:auto;color:var(--green)}
.kpi.col-2{grid-column:span 2}
/* 横向资源卡 */
.res-scroll{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.res-scroll::-webkit-scrollbar{display:none}
.res-card{
  flex:0 0 128px;scroll-snap-align:start;
  background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:12px;cursor:pointer;position:relative;
}
.res-card .ico{
  width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  margin-bottom:9px;
}
.res-card .ico svg{width:19px;height:19px}
.res-card h4{font-size:12.5px;font-weight:600;line-height:1.35}
.res-card .rs{font-size:9.5px;color:var(--dim);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.res-card .hot-badge{position:absolute;top:8px;right:8px;font-size:8.5px;color:#ffd9a8;background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.4);padding:1px 6px;border-radius:8px}
/* 图标色 */
.ico.blue{background:rgba(59,130,246,.14);color:var(--blue2)}
.ico.orange{background:rgba(249,115,22,.14);color:#fb923c}
.ico.green{background:rgba(34,197,94,.14);color:#4ade80}
.ico.purple{background:rgba(167,139,250,.14);color:#c4b5fd}
.ico.cyan{background:rgba(34,211,238,.14);color:#67e8f9}
.ico.pink{background:rgba(236,72,153,.14);color:#f472b6}
/* 快捷入口 */
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.quick{
  background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:11px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;
}
.quick svg{width:21px;height:21px}
.quick .ico{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.quick span{font-size:10px;color:var(--sub);white-space:nowrap}
/* 列表项 */
.list-item{
  background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:12px 13px;display:flex;align-items:center;gap:11px;cursor:pointer;margin-bottom:8px;
}
.list-item .li-ico{flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.list-item .li-ico svg{width:18px;height:18px}
.list-item .li-main{flex:1;min-width:0}
.list-item .li-title{font-size:13.5px;font-weight:600}
.list-item .li-desc{font-size:11px;color:var(--sub);margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.list-item .li-arrow{color:var(--dim);flex:0 0 auto}
.list-item .li-arrow svg{width:16px;height:16px}
/* 模式对比表 */
.cmp-hint{font-size:10.5px;color:var(--dim);text-align:center;padding:4px 0 6px;letter-spacing:.5px}
.cmp-wrap{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.cmp-scroll{
  overflow-x:auto;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-x pan-y;
  overscroll-behavior-x:contain;
  max-height:56vh;
  border-radius:0 0 13px 13px;
}
.cmp-scroll::-webkit-scrollbar{height:0}
.cmp-table{border-collapse:collapse;min-width:1080px;font-size:11px}
.cmp-table th{
  background:var(--bg2);color:var(--blue2);font-weight:600;text-align:left;
  padding:8px 10px;border-bottom:1px solid var(--line);border-right:1px solid rgba(34,48,74,.6);
  position:sticky;top:0;white-space:nowrap;
}
.cmp-table td{padding:8px 10px;border-bottom:1px solid rgba(34,48,74,.45);border-right:1px solid rgba(34,48,74,.45);vertical-align:top;color:#c9d6ec;line-height:1.55}
.cmp-table tr:last-child td{border-bottom:none}
.cmp-table .rowhead{background:rgba(59,130,246,.06);font-weight:600;color:var(--txt);white-space:nowrap}
.cmp-table .cat-tag{display:inline-block;font-size:9px;padding:1px 6px;border-radius:8px;margin-right:4px}
.cmp-table .cat-tag.retail{background:rgba(59,130,246,.15);color:#9ecbff}
.cmp-table .cat-tag.dist{background:rgba(249,115,22,.15);color:#fdba74}
/* 分组标题 */
.group-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--blue2);margin:16px 2px 8px}
.group-title svg{width:16px;height:16px}
.group-title .cnt{margin-left:auto;font-size:10px;color:var(--dim);font-weight:400}
/* 流程时间线 */
.stage-block{margin-bottom:12px}
.stage-head{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:11px 11px 0 0;font-size:13px;font-weight:700}
.stage-head .idx{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 auto}
.stage-body{border:1px solid var(--line);border-top:none;border-radius:0 0 11px 11px;background:var(--card);padding:4px 12px 6px}
.flow-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed rgba(34,48,74,.6)}
.flow-item:last-child{border-bottom:none}
.flow-item .f-dot{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--blue);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--blue2);margin-top:2px}
.flow-item .f-main{flex:1;min-width:0}
.flow-item .f-item{font-size:13px;font-weight:600}
.flow-item .f-row{font-size:11px;color:var(--sub);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 10px}
.flow-item .f-note{font-size:11px;color:var(--dim);margin-top:2px}
/* 问答 */
.qa-search{
  display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;margin-bottom:10px;
}
.qa-search svg{width:16px;height:16px;color:var(--dim);flex:0 0 auto}
.qa-search input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:13.5px}
.qa-search input::placeholder{color:var(--dim)}
.chip-scroll{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;-webkit-overflow-scrolling:touch}
.chip-scroll::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;font-size:11.5px;color:var(--sub);background:var(--card);
  border:1px solid var(--line);padding:6px 12px;border-radius:18px;cursor:pointer;transition:all .2s;
}
.chip.active{color:#fff;background:var(--blue);border-color:var(--blue)}
.qa-item{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:9px;overflow:hidden}
.qa-q{display:flex;align-items:flex-start;gap:9px;padding:12px 13px;cursor:pointer}
.qa-q .q-flag{flex:0 0 auto;font-size:9.5px;font-weight:700;color:var(--blue2);background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.3);padding:2px 7px;border-radius:8px;margin-top:1px}
.qa-q .q-text{flex:1;font-size:13.5px;font-weight:600;line-height:1.45}
.qa-q .q-arrow{flex:0 0 auto;color:var(--dim);transition:transform .25s}
.qa-q .q-arrow svg{width:15px;height:15px}
.qa-item.open .q-arrow{transform:rotate(180deg)}
.qa-a{display:none;padding:0 13px 13px;border-top:1px solid var(--line);margin:0 0 0 13px}
.qa-item.open .qa-a{display:block;animation:fadeIn .2s ease}
.qa-a .a-head{display:flex;align-items:center;gap:6px;padding:9px 0 6px;font-size:10px;color:var(--dim)}
.qa-a .a-head svg{width:12px;height:12px;color:var(--green)}
.qa-a .a-body{font-size:13px;color:#d5e0f2;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.qa-imgs{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px}
.qa-imgs img{width:100%;border-radius:8px;border:1px solid var(--line);display:block;cursor:zoom-in;background:#0d1526}
.qa-files{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.qa-file{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;font-size:12px;color:var(--blue2)}
.qa-file svg{width:15px;height:15px;flex:0 0 auto}
.qa-empty{text-align:center;color:var(--dim);font-size:12.5px;padding:36px 0}
/* 数据看板 */
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.stat .st-lab{font-size:10.5px;color:var(--sub);display:flex;align-items:center;gap:5px}
.stat .st-lab svg{width:12px;height:12px}
.stat .st-num{font-size:17px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .st-sub{font-size:9.5px;color:var(--dim);margin-top:1px}
/* 条形图 */
.bar-list{display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;align-items:center;gap:8px;font-size:11.5px}
.bar-row .b-name{flex:0 0 72px;text-align:right;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .b-track{flex:1;height:14px;background:var(--bg2);border-radius:7px;overflow:hidden}
.bar-row .b-fill{height:100%;border-radius:7px;min-width:2px;transition:width .6s ease}
.bar-row .b-val{flex:0 0 40px;font-weight:700;color:var(--txt);font-variant-numeric:tabular-nums;text-align:right}
/* 占比条 */
.donut-wrap{display:flex;align-items:center;gap:14px}
.donut{position:relative;width:92px;height:92px;flex:0 0 auto}
.donut .d-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .d-num{font-size:17px;font-weight:800}
.donut .d-lab{font-size:9px;color:var(--sub)}
.legend{flex:1;display:flex;flex-direction:column;gap:7px}
.legend .lg-row{display:flex;align-items:center;gap:7px;font-size:11.5px}
.legend .lg-dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.legend .lg-name{color:var(--sub);flex:0 0 auto}
.legend .lg-val{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.legend .lg-pct{color:var(--dim);font-size:10px;width:38px;text-align:right}
/* 折线 */
.line-chart{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px;overflow:hidden}
.line-chart svg{width:100%;height:auto;display:block}
.chart-legend{display:flex;gap:14px;justify-content:center;font-size:10.5px;color:var(--sub);margin-top:8px}
.chart-legend span{display:flex;align-items:center;gap:5px}
.chart-legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
/* 明细表 */
.data-table{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;font-size:11.5px}
.dt-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.dt-scroll::-webkit-scrollbar{height:0}
.data-table table{border-collapse:collapse;min-width:560px;width:100%}
.data-table th{background:var(--bg2);color:var(--blue2);font-weight:600;padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.data-table td{padding:7px 10px;border-bottom:1px solid rgba(34,48,74,.4);color:#c9d6ec;white-space:nowrap;font-variant-numeric:tabular-nums}
.data-table tr:last-child td{border-bottom:none}
/* 审计资料 */
.audit-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.audit-card{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;cursor:pointer}
.audit-card .a-img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#0d1526;display:block}
.audit-card .a-info{padding:9px 11px}
.audit-card .a-name{font-size:12.5px;font-weight:600}
.audit-card .a-desc{font-size:10.5px;color:var(--sub);margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.audit-card .a-note{font-size:10px;color:var(--dim);margin-top:2px}
/* 流程卡片图 */
.flow-card{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:10px}
.flow-card .f-head{display:flex;align-items:center;gap:8px;padding:11px 13px;font-size:13.5px;font-weight:700;border-bottom:1px solid var(--line)}
.flow-card .f-head svg{width:16px;height:16px;color:var(--blue2)}
.flow-card img{width:100%;display:block;background:#0d1526}
/* 详情页 / 要点速览 */
.detail-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.detail-header .back{width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.detail-header .back svg{width:17px;height:17px}
.detail-header h2{font-size:16px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail-header .ext-tag{font-size:9.5px;color:#9ecbff;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.3);padding:2px 8px;border-radius:10px}
.ext-intro{font-size:12.5px;color:var(--sub);line-height:1.65;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:12px;white-space:pre-wrap}
.ext-sec{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px}
.ext-sec h4{font-size:13.5px;font-weight:700;color:var(--blue2);display:flex;align-items:center;gap:7px;margin-bottom:9px}
.ext-sec h4 .sec-num{flex:0 0 auto;width:19px;height:19px;border-radius:6px;background:rgba(59,130,246,.14);color:var(--blue2);font-size:11px;display:flex;align-items:center;justify-content:center}
.ext-items{display:flex;flex-direction:column;gap:7px}
.ext-item{font-size:12.5px;color:#d5e0f2;line-height:1.6;display:flex;gap:8px}
.ext-item .it-dot{flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--blue);margin-top:7px}
.ext-item .it-body{flex:1;min-width:0}

/* 视频播放器 */
.ext-video{background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0}
.ev-title{font-size:11px;color:var(--blue2);padding:7px 10px;font-weight:600;border-bottom:1px solid var(--line);background:rgba(59,130,246,.06)}
.ev-player{width:100%;display:block;background:#000;max-height:320px;object-fit:contain}

.ext-fig{margin:0 0 10px;text-align:center}
.ext-fig figcaption{font-size:11px;color:var(--blue2);margin-top:4px;line-height:1.5}
.ext-img{width:100%;border-radius:10px;border:1px solid var(--line);margin-top:8px;display:block;cursor:zoom-in;background:#0d1526}
.ext-table-wrap{overflow-x:auto;margin-top:6px;-webkit-overflow-scrolling:touch}
.ext-table-wrap::-webkit-scrollbar{height:0}
.ext-table{border-collapse:collapse;min-width:440px;font-size:11.5px;width:100%}
.ext-table th{background:var(--bg2);color:var(--blue2);padding:7px 10px;text-align:left;border:1px solid var(--line);white-space:nowrap}
.ext-table td{padding:7px 10px;border:1px solid rgba(34,48,74,.5);color:#c9d6ec;line-height:1.55;white-space:pre-wrap}
.ext-table td.hl{font-weight:600;color:var(--txt);white-space:nowrap}
/* 图片查看器 */
.viewer{
  position:fixed;inset:0;z-index:100;background:rgba(5,8,15,.96);
  display:none;align-items:center;justify-content:center;flex-direction:column;
}
.viewer.open{display:flex}
.viewer img{max-width:94%;max-height:82%;border-radius:10px}
.viewer .v-close{position:absolute;top:calc(var(--safe-top) + 14px);right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;cursor:pointer}
.viewer .v-close svg{width:18px;height:18px}
.viewer .v-cap{color:var(--sub);font-size:11px;margin-top:12px;max-width:90%;text-align:center}
/* 刷新提示 */
.foot-note{text-align:center;font-size:10px;color:var(--dim);padding:16px 0 6px;line-height:1.7}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--safe-bottom) + 74px);transform:translateX(-50%) translateY(20px);background:rgba(30,41,59,.95);border:1px solid var(--line);color:var(--txt);font-size:12.5px;padding:9px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:all .3s;z-index:60;white-space:nowrap;max-width:86%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:768px){
  body{display:flex;justify-content:center;background:#070b16}
  #app{box-shadow:0 0 60px rgba(0,0,0,.6)}
}

/* 人员筛选 */
.filter-card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:10px}
.filter-label{font-size:11px;color:var(--sub);margin-bottom:6px;display:flex;align-items:center;gap:4px}
.filter-label svg{width:12px;height:12px}
.f-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.f-bd{flex:1;min-width:150px}
.f-picker{flex:1;min-width:120px}
.f-picker input,.f-bd select{
  width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);
  border-radius:9px;padding:8px 10px;font-size:12px;outline:none;
  color-scheme:dark;
}
.f-picker input::-webkit-calendar-picker-indicator{filter:invert(.7)}
.f-quick{display:flex;gap:6px;flex-wrap:wrap}
.f-qchip{font-size:10.5px;color:var(--sub);background:var(--bg2);border:1px solid var(--line);padding:5px 10px;border-radius:14px;cursor:pointer;transition:all .2s}
.f-qchip.active{color:#fff;background:var(--blue);border-color:var(--blue)}
.f-search{width:100%;margin-top:10px;background:var(--blue);color:#fff;border:none;border-radius:10px;padding:10px;font-size:13px;font-weight:600;cursor:pointer}
.f-search:active{opacity:.85}
.filter-res{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.f-res{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.f-res .fr-lab{font-size:10.5px;color:var(--sub)}
.f-res .fr-num{font-size:18px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.f-res .fr-sub{font-size:9.5px;color:var(--dim);margin-top:1px}
.f-list{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.f-list-head{display:flex;padding:9px 12px;background:var(--bg2);color:var(--blue2);font-size:10.5px;font-weight:600}
.f-row2{display:flex;padding:9px 12px;border-bottom:1px solid var(--line);font-size:11px;align-items:center;gap:6px}
.f-row2:last-child{border-bottom:none}
.f-row2 .fd-date{flex:0 0 72px;color:var(--dim)}
.f-row2 .fd-bd{flex:0 0 54px;font-weight:600}
.f-row2 .fd-store{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub)}
.f-row2 .fd-amt{flex:0 0 62px;text-align:right;font-weight:700;color:var(--blue2)}
.f-row2 .fd-status{flex:0 0 40px;font-size:9.5px;padding:2px 5px;border-radius:8px;text-align:center}
.f-empty{padding:26px;text-align:center;color:var(--dim);font-size:12px}

</style>
</head>

<script>
/* ===== 数据 ===== */
const DATA = {"generated":"2026-09-03 14:52:26","qa":[{"id":1,"question":"品类上传图片要求","answer":"手机：线上国补要求包装SN+手机激活SN+包装手机激活SN+人包装手机，水印带时间+地点+经纬度，线下国补要求包装SN+手机激活SN+包装手机SN，水印带时间+地点+经纬度\n平板：包装sn+平板激活屏幕sn+包装sn平板激活sn+三合一（看情况）所有照片带水印：时间+地址+经纬度\n电脑：电脑背板串码和包装盒串码+开机屏幕显示sn和包装盒串码两张图片，水印需带时间+地点+经纬度 \n若图片不符合要求需要更换就审核不通过→编辑（替换相关的图片后点击提交）","tag":"门店","category":"门店","images":["https://aka.doubaocdn.com/s/TGet5cKFqg","https://aka.doubaocdn.com/s/9r3v2VaAsv"]},{"id":2,"question":"门店审核要求","answer":"路径：运营助手→购机助手→门店列表→待审核\n照片要求：有门头整体","tag":"门店","category":"门店","images":["https://aka.doubaocdn.com/s/UB32WNCMUb"]},{"id":3,"question":"配置线下国补","answer":"路径：运营助手→购机助手→门店列表→已审核→编辑子商户号","tag":"国补","category":"国补","images":["https://aka.doubaocdn.com/s/2Q92wp5cWT"]},{"id":4,"question":"分销订单查看","answer":"路径：运营助手→购机助手→进货订单","tag":"分销","category":"分销","images":["https://aka.doubaocdn.com/s/IOQZiMIq7M"]},{"id":5,"question":"查看国补商品备案金额","answer":"商委会发相关的国补商品备案表/表格里没有的在运营助手→购机助手→国补商品库里查看","tag":"国补","category":"国补","images":["https://aka.doubaocdn.com/s/rfmasviUUt"]},{"id":6,"question":"国补申请银联上送","answer":"线上国补：运营助手→购机助手→国补申请→提交审计→输入提交城市→编辑（核对实名及激活图片信息，要平台开票后及上传了支付凭证的才能提交审计）\n线下国补：运营助手→购机助手→国补申请→提交审计→输入提交城市（需在云闪付上提交）","tag":"线上线下","category":"线上线下","images":["https://aka.doubaocdn.com/s/UV2g2mOHYL"],"attachments":[{"name":"国补申请银联上送-线下板块.pdf","url":"https://goujitong-1-d4g3ek7z433faa213-1474472339.tcloudbaseapp.com/qa-files/ole1.pdf","type":"application/pdf","size":2455196}]},{"id":7,"question":"客户付款跳转云闪付没有用到优惠券","answer":"查看实名是否一致，定位是否开启，APP是否更新，领的券和活动是否是同一个，打开微信云闪付小程序-我的-我的优惠券，查看券详情，如果显示是定位问题但是手机定位是开了的就将小程序删除重新进入","tag":"云闪付","category":"云闪付","images":[]},{"id":8,"question":"国补订单押金运营助手导入推单","answer":"https://ycndf41nbgc6.feishu.cn/wiki/ITslwW5z3iwNrrkeSxicUmt3nmd?from=from_copylink\n押金要整数，排款完成后要将门店明细发给对应的供应商","tag":"国补押金","category":"国补押金","images":[]},{"id":9,"question":"门店购机通发布产品显示设置金额过大","answer":"找门店要产品型号69码等，查看国补商品库价格是否一样，再进行相应的修改","tag":"门店现货","category":"门店现货","images":[]},{"id":10,"question":"银联审计联系方式","answer":"","tag":"国补","category":"国补","images":[],"attachments":[{"name":"银联审计联系方式-解决方法.pdf","url":"https://goujitong-1-d4g3ek7z433faa213-1474472339.tcloudbaseapp.com/qa-files/ole2.pdf","type":"application/pdf","size":152187}]},{"id":11,"question":"商家在发布商品时，发现没有该型号？","answer":"在其他系列里面查询，若无该型号，请及时联系品牌运营","tag":"门店现货","category":"门店现货","images":[]},{"id":12,"question":"商家发布商品时，显示超过最大金额","answer":"请按照参考官网零售价，勿超过零售价售卖。若填写零售价显示超过最大金额，及时联系品牌运营。","tag":"门店现货","category":"门店现货","images":[]},{"id":13,"question":"在做完一单国补后，多久能结算款项，以及国补押金多久能退回？","answer":"商家开票后，一般为T+1/T+2日结算。国补押金2-3月，政府结算后，再退回。","tag":"国补押金","category":"国补押金","images":[]},{"id":14,"question":"客户退款到款时效","answer":"今天发起退款，明天才能到账","tag":"售后","category":"售后","images":[]},{"id":15,"question":"购机通与市场助手之间的联系","answer":"市场助手更偏向于大订单分销铺货类的，购机通包含了市场助手的数据，市场助手做不了国补","tag":"市场助手","category":"市场助手","images":[]},{"id":16,"question":"商品在运营助手国补商品库里但是依然做不了国补","answer":"重新在运营助手上传导入国补商品价格修改表","tag":"国补","category":"国补","images":[]},{"id":17,"question":"购机通注册企业主体类型时显示该主体已存在","answer":"删除小程序重新进","tag":"门店","category":"门店","images":[]},{"id":18,"question":"国补给大商回款时间","answer":"大商上传发票后T+1日回款，10：00之后上传的T+2日回款","tag":"国补","category":"国补","images":[]},{"id":19,"question":"国补审计显示订单金额大于国补金额","answer":"找消费者退货退款，最好是在备案表里确认一下","tag":"国补","category":"国补","images":[]},{"id":20,"question":"客户取消国补单退款","answer":"客户购机通点申请退款→门店后台点确认收货→等待售后部门找到我们询问我们情况是否要进行退款操作→售后部门操作退款","tag":"国补","category":"国补","images":[]},{"question":"变更BD申请","answer":"能人家走30-52审批","tag":"门店","category":"门店","images":[],"id":22},{"question":"用印申请","answer":"能人家走10-07审批","tag":"门店","category":"门店","images":[],"id":23},{"id":24,"question":"门店现货上架适合什么门店?需要满足哪些条件?","answer":"适合有库存、想清品牌压货的规模门店。条件:①入驻购机通成为供应商 ②一般纳税人、可开13%发票 ③同意先票后款结算。","tag":"门店现货","category":"门店现货","images":[]},{"id":25,"question":"门店现货的商品零售价怎么维护?平台服务费怎么收?","answer":"门店只需维护零售价;平台服务费=零售价×5%(点位由省分定)。售后兜底:成交货源为门店时,售后方为门店。","tag":"门店现货","category":"门店现货","images":[]},{"id":26,"question":"门店现货的货款怎么结算(先票后款)?","answer":"门店在【待开票】查看货款结算单金额→开具发票并上传→结算方回款。T日10:00前上传发票T+1回款,10:00后T+2回款(不含节假日);每月11/21/26号生成电子采销合同需签署。","tag":"门店现货","category":"门店现货","images":[]},{"id":27,"question":"门店现货解决了什么痛点?","answer":"①平台缺货:消费者问询时平台无货,即使门店有货也只能流失商机——门店现货让门店货上平台销售 ②门店压货:门店可先走压货商品,减少库存压力。","tag":"门店现货","category":"门店现货","images":[]},{"id":28,"question":"大商铺货(前置仓)有哪两种模式?","answer":"分货模式 + 点单模式。分货模式:大商主导各门店分货量,门店作为前置仓,价优;点单模式已下线。","tag":"铺货","category":"铺货","images":[]},{"id":29,"question":"大商铺货门店的操作链路是什么?","answer":"门店入驻(购机通扫BD二维码)→市场助手开卡+充值(平台钱包)→门店铺货→消费者转化→门店出货+激活信息上传。一般纳税人需提前联系运营开白才能用市场助手。","tag":"铺货","category":"铺货","images":[]},{"id":30,"question":"大商铺货的\"市场助手\"货款保障金是什么?","answer":"市场助手可理解为货款保障金(质保金),需各省分定好线下国补回款保障金协议并签订;TOC履约完成后,省分在运营助手【市场助手】-【SN档案】点击返款,门店即可在市场助手的平安钱包看到退回的质保金。","tag":"铺货","category":"铺货","images":[]},{"id":31,"question":"大商铺货绑卡有什么注意点?","answer":"企业账户只能选对公账户,个体工商户两者均可选;充值时要用绑定的银行卡向充值账户转账。","tag":"铺货","category":"铺货","images":[]},{"id":32,"question":"云仓模式(快递)的货物流转链路?","answer":"省分集采→入平台国补仓→线上下单→物流到货→快递激活。支持快递发货+平台自有货源、优惠券设置场景。","tag":"云仓","category":"云仓","images":[]},{"id":33,"question":"云仓模式退货怎么操作?","answer":"消费者在购机通小程序内退款:未发货直接退;发货后未收到/未激活,客服审核同意售后(省分需确认此品无法再走国补),商品退回后客服退款。","tag":"云仓","category":"云仓","images":[]},{"id":34,"question":"门店铺货的B端下单流程?","answer":"购机通省分通过运营助手导入铺货订单→门店在购机通支付订单→省分发货→门店收货确认→完成铺货。","tag":"铺货","category":"铺货","images":[]},{"id":35,"question":"门店铺货的C端(消费者)销售流程?","answer":"消费者通过购机通下单(关联铺货订单串码)→门店在购机通处理销售订单并发货→消费者收货→购机通财务核实后向门店返款。","tag":"铺货","category":"铺货","images":[]},{"id":36,"question":"门店钱包在哪里开通?","answer":"购机通→我的→门店钱包;未开通钱包的门店需先开通,开通后可长期用于铺货订单支付。","tag":"铺货","category":"铺货","images":[]},{"id":37,"question":"购机通+醒柜给门店带来什么价值?","answer":"①增加范围:即时配送覆盖3公里客群 ②零库存压力:平台直供无需垫资,库存周转率提升50%+ ③精准运营:数据反哺爆款预置 ④国补杠杆:垫资参与补贴活动 ⑤转化闭环:线上下单+到店体验融合。","tag":"即时零售","category":"即时零售","images":[]},{"id":38,"question":"醒柜模式门店需要提前准备什么?","answer":"①扫码入驻购机通成为门店 ②试点(上海)内可见全品类全品牌货(第一期平台默认组) ③自有库-门店现货上翻需一般纳税人资格+开通门店现货(必须入柜)。","tag":"即时零售","category":"即时零售","images":[]},{"id":39,"question":"购机通进货(下沉分销)是什么业务?","answer":"B2B撮合交易平台:助力大商/强商触达全国下沉门店做分销;助力门店拿到更多优势品/价、轻量库存;平台本质是撮合交易,提供商品+交易+钱包+对账+进销存全流程。","tag":"分销","category":"分销","images":[]},{"id":40,"question":"进货场景的卖家怎么上架商品?","answer":"在市场助手上架:注册+认证(企业/个体工商户)→实名认证→开通平安钱包→发布商品。手机端随时上架,PC端可批量上传(登录网址见市场助手操作手册)。","tag":"分销","category":"分销","images":[]},{"id":41,"question":"市场助手的登录注册流程?","answer":"扫描小程序二维码→注册新主体(企业或个体工商户录入信息)→实名认证→开通平安钱包→充值。","tag":"市场助手","category":"市场助手","images":[]},{"id":42,"question":"市场助手什么场景要求一般纳税人?","answer":"铺货场景:要求卖家为企业级用户且具备一般纳税人资格(涉及给能良开票,同时需为该主体开国补O2O钱保模式);进货场景不要求买家和卖家的类型。","tag":"市场助手","category":"市场助手","images":[]},{"id":43,"question":"订单助手打通购机通分销适用什么场景?","answer":"卖家是能良系主体、买家是购机通门店、业务载体是购机通库存页面;仅适用能良系自营分销,非能良系主体不适用。","tag":"分销","category":"分销","images":[]},{"id":44,"question":"订单助手分销的买家(门店)下单前需要做什么准备?","answer":"①身份需企业或个体工商户(个人不可下单) ②开通平安钱包并按需充值 ③在客户PC管理后台(xswc.xingshiapp.cn)签框架合同(一次长期有效)。","tag":"分销","category":"分销","images":[]},{"id":45,"question":"订单助手分销的服务费和开票规则?","answer":"仅向卖家收千2平台服务费;蓝票每月6/16/26自动出对账单→买家对账并签购销合同→系统自动触发开票审批;退货走红冲,每月6/16/26对账逆向订单,税务开红票并录入。","tag":"分销","category":"分销","images":[]},{"id":46,"question":"订单助手分销买家(门店)的售后怎么发起?","answer":"购机通分销买家无法在客户PC管理后台发起追单或售后,需在购机通小程序发起。","tag":"分销","category":"分销","images":[]},{"id":47,"question":"国补O2O一件代发的供应商操作流程?","answer":"操作端为无仓:①抢单 ②上传信息(3C类务必录入三码,家电录入SN和快递单号) ③约快递 ④点击发货;快递费+微派服务费从供应商保证金中扣除。","tag":"国补O2O","category":"国补O2O","images":[]},{"id":48,"question":"国补O2O一件代发怎么维护发货地址?","answer":"有订单后触发新增发货地址→月结账号选择【平台月结】+签署协议(盖电子面章,主账号/法人手机号验证码校验)→录入地址信息(务必选平台月结)。","tag":"国补O2O","category":"国补O2O","images":[]},{"id":49,"question":"国补押金是什么?","answer":"购机通质押国补金额的10%作为货款保证金(押金);完整回款操作流程见《购机通门店国补押金-回款操作手册》。","tag":"国补押金","category":"国补押金","images":[]},{"id":50,"question":"云闪付领券怎么操作?","answer":"云闪付领券是消费者下单链路中的领券环节,操作指引见《云闪付领券操作视频教程》(工作台SOP-云闪付领券操作视频)。","tag":"云闪付","category":"云闪付","images":[]},{"id":51,"question":"做分销如何在购机通【库存】模块下进货订单?","answer":"在购机通【库存】页面下单:下单(选品/选SKU/下单)→查看订单→去收货;2026年1月8日进货兼容到库存后,省分公司市场助手上架的订单在库存页下单会自动在聚水潭创建订单,无需手动创建。","tag":"分销","category":"分销","images":[]},{"id":52,"question":"大商未收到打款信息","answer":"主账号查看是否未签署框架合同","tag":"新增","category":"新增","images":[]}],"flow":[{"file":"flow-images/image3.png","title":"以销定采","desc":"","url":"https://aka.doubaocdn.com/s/gqtJV4Hput"},{"file":"flow-images/image5.png","title":"铺货","desc":"","url":"https://aka.doubaocdn.com/s/9PChJ9l1jd"}],"audit":[{"cat":"手机","name":"外包装","desc":"手机外包装SN码","note":"清晰的的SN码照片（需水印信息：地址+时间）","file":"audit-images/image2.png","url":"https://aka.doubaocdn.com/s/mPe7jCF7pI"},{"cat":"手机","name":"SN+IEMI码","desc":"激活显示","note":"手机亮屏激活的SN+IEMI照片（需水印信息：地址+时间）","file":"audit-images/image3.png","url":"https://aka.doubaocdn.com/s/HKyafQhFr1"},{"cat":"手机","name":"手机+包装合照","desc":"激活显示","note":"包装盒和手机SN码信息必须一致，手机亮屏（需水印信息：地址+时间）","file":"audit-images/image4.png","url":"https://aka.doubaocdn.com/s/meSL2hWZP1"},{"cat":"手机","name":"人物+门头+手机+包装合照","desc":"消费者门店自提激活","note":"消费者站在门店外与手机的合照（需水印信息：地址+时间）","file":"audit-images/image5.jpeg","url":"https://aka.doubaocdn.com/s/RwVprcvLoM"},{"cat":"穿戴-手表/手环","name":"外包装","desc":"外包装SN码","note":"清晰的的SN码照片（需水印信息：地址+时间）","file":"audit-images/image6.jpeg","url":"https://aka.doubaocdn.com/s/8LyUCA7d5x"},{"cat":"穿戴-手表/手环","name":"SN码","desc":"激活显示","note":"手表亮屏激活的SN码照片（需水印信息：地址+时间）","file":"audit-images/image7.jpeg","url":"https://aka.doubaocdn.com/s/rOahoi0Zda"},{"cat":"穿戴-手表/手环","name":"手表/手环+包装合照","desc":"激活显示","note":"包装盒和手表SN码信息必须一致，手机亮屏（需水印信息：地址+时间）","file":"audit-images/image8.png","url":"https://aka.doubaocdn.com/s/L3RTDQfiDk"},{"cat":"穿戴-手表/手环","name":"人物+门店+手表/手环+包装合照","desc":"消费者门店自提激活","note":"消费者站在门店外与手表的合照（需水印信息：地址+时间）","file":"audit-images/image9.jpeg","url":"https://aka.doubaocdn.com/s/EvVo2NzK67"},{"cat":"笔记本","name":"外包装+机身","desc":"外包装SN码+机身SN码","note":"清晰的的SN码照片（需水印信息：地址+时间）","file":"audit-images/image10.png","url":"https://aka.doubaocdn.com/s/RV3pZV42vq"},{"cat":"笔记本","name":"外包装+笔记本亮屏","desc":"外包装SN码+亮屏产品序列号","note":"清晰的的SN码照片+产品序列号（需水印信息：地址+时间）","file":"audit-images/image11.png","url":"https://aka.doubaocdn.com/s/5iVFQydscs"},{"cat":"笔记本","name":"人物+门头+笔记本电脑（亮屏）","desc":"消费者门店自提激活","note":"消费者站在门店外与笔记本的合照（需水印信息：地址+时间）","file":"audit-images/image12.jpeg","url":"https://aka.doubaocdn.com/s/IT7Qz4ti6V"},{"cat":"笔记本","name":"外包装+机身（台式机）","desc":"外包装SN码+机身SN码","note":"清晰的的SN码照片（需水印信息：地址+时间）","file":"audit-images/image13.png","url":"https://aka.doubaocdn.com/s/diNLXv8XGJ"},{"cat":"平板","name":"外包装","desc":"外包装SN码","note":"清晰的的SN码照片（需水印信息：地址+时间）","file":"audit-images/image14.png","url":"https://aka.doubaocdn.com/s/LWnGYFuru3"},{"cat":"平板","name":"SN码","desc":"平板SN码","note":"清晰的的SN码照片（需水印信息：地址+时间）","file":"audit-images/image15.png","url":"https://aka.doubaocdn.com/s/jDhq5Gn63V"},{"cat":"平板","name":"外包装+平板亮屏","desc":"外包装SN码+亮屏产品序列号","note":"清晰的的SN码照片+产品序列号（需水印信息：地址+时间）","file":"audit-images/image16.png","url":"https://aka.doubaocdn.com/s/G1OLqEUQUw"},{"cat":"平板","name":"人物+门头+平板+包装合照","desc":"消费者门店自提激活","note":"消费者站在门店外与平板的合照（需水印信息：地址+时间）","file":"audit-images/image17.jpeg","url":"https://aka.doubaocdn.com/s/D050gDXCt5"}],"ext":{"r1":{"title":"以销定采","tag":"以销定采 · 门店自提/快递","intro":"门店不提前囤货：\n顾客确定要买，产生销售订单\n门店在购机通提交订单向平台下单\n平台才向品牌方调拨、发货给到门店，门店收到货再交付给客户\n先有客户订单，再去采购进货，门店零前置库存，没有压货风险。","sections":[{"h":"一、三要素","items":["① 门店入驻无仓，成为供应商","② 门店为一般纳税人，可开具 13% 发票","③ 结算模式：门店同意「先票后款」"],"imgs":[]},{"h":"三、关键流程（6步开通）","table":{"heads":["步骤","操作要点"],"rows":[["① 入驻【购机通】","务必选择【企业】入驻，并完成门店审核"],["② 审核通过","点击【去开通】"],["③ 立即开通","购机通主体必须为企业级 + 一般纳税人资质"],["④ 开通钱包","—"],["⑤ 小额打款+验证码验证","完成后点击【绑定】"],["⑥ 开通完成","老客户仅需开通服务即可"]]},"imgs":["https://aka.doubaocdn.com/s/8mvlqjE6mV","https://aka.doubaocdn.com/s/GQeNMNrSNG","https://aka.doubaocdn.com/s/xyBEUqNOKo","https://aka.doubaocdn.com/s/vV73j2IIqD","https://aka.doubaocdn.com/s/8eUJPtV82o","https://aka.doubaocdn.com/s/AkjzgSVU1b"]},{"h":"四、商品发布（选品+零售价+配送方式）","items":["① 点击【立即发布】→ ② 选择需发布商品 → ③ 录入价格+库存+配送方式 → ④ 发布成功可直接分享给消费者转化下单 → ⑤ 前展页面已外展，消费者也可搜索下单",{"kind":"img","src":"https://aka.doubaocdn.com/s/IVF52 /* ===== 工具 ===== */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtMoney(n){if(n==null)return '0';return Number(n).toLocaleString('zh-CN',{maximumFractionDigits:0})}
function fmtMoney2(n){if(n==null)return '0';return Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function hashQuery(){const h=location.hash.slice(1);const i=h.indexOf('?');return {path:i<0?h:h.slice(0,i), params:i<0?{}:Object.fromEntries(new URLSearchParams(h.slice(i+1)))}}

function renderStoreDaily(){
  const daily=DATA.store.daily.slice(-14);
  if(!daily.length)return '<div class="qa-empty">暂无每日数据</div>';
  const maxNew=Math.max(...daily.map(d=>d.new),1);
  const maxFirst=Math.max(...daily.map(d=>d.first),1);
  const w=600,h=210,pl=10,pr=10,pt=16,pb=24;
  const iw=w-pl-pr, ih=h-pt-pb;
  const step=iw/Math.max(daily.length-1,1);
  const y=v=>pt+ih-(v/maxNew)*ih;
  const y2=v=>pt+ih-(v/maxFirst)*ih;
  const newLine=daily.map((d,i)=>(pl+i*step)+','+y(d.new)).join(' ');
  const firstLine=daily.map((d,i)=>(pl+i*step)+','+y2(d.first)).join(' ');
  const area=daily.map((d,i)=>(pl+i*step)+','+y(d.new)).join(' ')+' '+pl+','+(pt+ih)+' '+(pl+iw)+','+(pt+ih);
  const dots=daily.map((d,i)=>`<circle cx="${pl+i*step}" cy="${y(d.new)}" r="2.5" fill="#3b82f6"/>`).join('');
  const labels=daily.map((d,i)=>`<text x="${pl+i*step}" y="${pt+ih+16}" font-size="9" fill="#5f7194" text-anchor="middle">${d.date.slice(5)}</text>`).join('');
  return `<div class="line-chart">
    <svg viewBox="0 0 ${w} ${h}">
      <polygon points="${area}" fill="rgba(59,130,246,.12)"/>
      <polyline points="${newLine}" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linejoin="round"/>
      <polyline points="${firstLine}" fill="none" stroke="#f97316" stroke-width="1.6" stroke-dasharray="4 3" stroke-linejoin="round"/>
      ${dots}
      ${labels}
      <text x="${pl}" y="${pt-4}" font-size="9" fill="#5f7194">新增</text>
    </svg>
    <div class="chart-legend"><span><i style="background:var(--blue)"></i>每日新增</span><span><i style="background:var(--orange)"></i>首次出单</span></div>
  </div>`;
}

function trendChart(trend,max){
  if(!trend.length)return '<div class="qa-empty">暂无趋势数据</div>';
  const w=600,h=190,pl=12,pr=10,pt=14,pb=24;
  const iw=w-pl-pr, ih=h-pt-pb;
  const step=iw/Math.max(trend.length-1,1);
  const y=v=>pt+ih-(v/max)*ih;
  const line=trend.map((t,i)=>(pl+i*step)+','+y(t[1])).join(' ');
  const area=trend.map((t,i)=>(pl+i*step)+','+y(t[1])).join(' ')+' '+pl+','+(pt+ih)+' '+(pl+iw)+','+(pt+ih);
  const dots=trend.map((t,i)=>`<circle cx="${pl+i*step}" cy="${y(t[1])}" r="2.5" fill="#3b82f6"/>`).join('');
  const labels=trend.map((t,i)=>i%2===0?`<text x="${pl+i*step}" y="${pt+ih+16}" font-size="9" fill="#5f7194" text-anchor="middle">${t[0]}</text>`:'').join('');
  return `<svg viewBox="0 0 ${w} ${h}">
    <polygon points="${area}" fill="rgba(59,130,246,.12)"/>
    <polyline points="${line}" fill="none" stroke="#3b82f6" stroke-width="2.2" stroke-linejoin="round"/>
    ${dots}${labels}
  </svg>`;
}
function renderBDDaily(){
  const rows=DATA.order.bd_daily.slice(0,30);
  if(!rows.length)return '<div class="qa-empty">暂无明细</div>';
  return `<div class="data-table"><div class="dt-scroll"><table>
    <thead><tr><th>日期</th><th>所属BD</th><th>订单数</th><th>金额（元）</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${esc(r.date_cn)}</td><td>${esc(r.bd)}</td><td>${r.orders}</td><td>${fmtMoney(r.amount)}</td></tr>`).join('')}</tbody>
  </table></div></div>
  <div class="foot-note">近 ${rows.length} 天记录 · 下拉更多在完整版查看</div>`;
}

let filterState={dim:'order',bd:'全部',d0:'',d1:'',quick:''};
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function monthStart(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01'}
function yearStart(){return new Date().getFullYear()+'-01-01'}
function setQuick(q){
  const map={'today':[todayStr(),todayStr()],'7d':[daysAgo(6),todayStr()],'30d':[daysAgo(29),todayStr()],'month':[monthStart(),todayStr()],'year':[yearStart(),todayStr()],'all':['','']};
  const r=map[q]||['',''];
  filterState.d0=r[0];filterState.d1=r[1];filterState.quick=q;
  const f=document.querySelector('#filter-d0');if(f)f.value=r[0];
  const t=document.querySelector('#filter-d1');if(t)t.value=r[1];
  applyFilter();
}
function switchDim(d){filterState.dim=d;filterState.bd='全部';filterState.d0='';filterState.d1='';filterState.quick='';applyFilter();}
function filterRows(){
  const det=filterState.dim==='store'?(DATA.store.detail||[]):(DATA.order.detail||[]);
  const bd=filterState.bd;
  return det.filter(r=>{
    if(bd!=='全部' && r.bd!==bd)return false;
    const d=filterState.dim==='store'?(r.created||''):(r.date||'');
    if(filterState.d0 && d<filterState.d0)return false;
    if(filterState.d1 && d>filterState.d1)return false;
    return true;
  });
}

        <div class="f-picker"><div class="filter-label">${isStore?'创建时间·结束':'结束日期'}</div><input id="filter-d1" type="date" value="${filterState.d1}" onchange="filterState.d1=this.value;filterState.quick='';applyFilter()"></div>

      ${rowsDesc.length?rowsDesc.map(r=>`

function applyFilter(){const h=renderFilter();const b=document.querySelector('#data-body');if(b)b.innerHTML=h;}
/* 环图 */
function donutSVG(pct){
  const r=42,c=2*Math.PI*r;
  const off=c*(1-pct/100);
  return `<svg viewBox="0 0 96 96" width="92" height="92">
    <circle cx="48" cy="48" r="${r}" fill="none" stroke="#1a2742" stroke-width="11"/>
    <circle cx="48" cy="48" r="${r}" fill="none" stroke="#22c55e" stroke-width="11" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 48 48)" style="transition:stroke-dashoffset .8s ease"/>
  </svg>`;
}

function openResource(id){
  const r=DATA.resources.find(x=>x.id===id);

  location.hash='#detail?r='+id;

function renderDetail(){
  const {params}=hashQuery();
  const id=params.r||'r1';
  const r=DATA.resources.find(x=>x.id===id);
  const ext=DATA.ext[id];
  if(!r){views.detail.innerHTML='<div class="qa-empty">未找到该业务</div>';switchView('detail');return}
  let extHtml='';
  if(ext){
    const secs=ext.sections||[];
    extHtml=`${ext.intro?`<div class="ext-intro">${esc(ext.intro)}</div>`:''}
    ${secs.map((s,si)=>{
      let body='';
      if(s.items&&s.items.length){
        body=`<div class="ext-items">${s.items.map(it=>{
          if(typeof it==='string')return `<div class="ext-item"><span class="it-dot"></span><span class="it-body">${esc(it)}</span></div>`;
          if(it&&it.kind==='img')return it.src?`<figure class="ext-fig"><img class="ext-img" src="${it.src}" loading="lazy" onclick="openViewer('${it.src}','${esc(r.name)}')">${it.caption?`<figcaption>${esc(it.caption)}</figcaption>`:''}</figure>`:'';
          if(it&&it.kind==='video')return it.src?`<div class="ext-video"><div class="ev-title">${esc(it.title||'')}</div><video class="ev-player" src="${it.src}" controls preload="metadata" playsinline webkit-playsinline></video></div>`:'';
          if(it&&it.text)return `<div class="ext-item"><span class="it-dot"></span><span class="it-body">${esc(it.text)}</span></div>`;
          return '';
        }).join('')}</div>`;
      }
      if(s.table){
        let tb=s.table;
        if(typeof tb==='string'){try{tb=JSON.parse(tb)}catch(e){}}
        if(tb&&tb.heads&&tb.rows){
          body+=`<div class="ext-table-wrap"><table class="ext-table">
            <thead><tr>${tb.heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
            <tbody>${tb.rows.map(row=>`<tr>${row.map((cell,ci)=>`<td class="${ci===0?'hl':''}">${esc(cell)}</td>`).join('')}</tr>`).join('')}</tbody>
          </table></div>`;
        }
      }
      if(s.imgs&&s.imgs.length){
        body+=`<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:6px">${s.imgs.map((im,ix)=>`<img class="ext-img" style="margin:0" src="${im}" loading="lazy" onclick="openViewer('${im}','${esc(r.name)}')">`).join('')}</div>`;
      }
      return body?`<div class="ext-sec"><h4><span class="sec-num">${si+1}</span>${esc(s.h||'')}</h4>${body}</div>`:'';
    }).join('')}`;
  }
  const cat=r.cat==='retail'?'零售业务':r.cat==='dist'?'分销业务':(r.type==='sop'?'操作手册':'文档');
  views.detail.innerHTML=`
    <div class="detail-header">
      <div class="back" onclick="historyBack()">${ICONS.back}</div>
      <h2>${esc(r.name)}</h2>
      <span class="ext-tag">${esc(cat)}</span>
    </div>
    <div class="card" style="margin-bottom:12px">
      <p style="margin:0">${esc(r.desc)}</p>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">${(r.tags||[]).map(t=>`<span class="tag" style="font-size:10px;color:#9ecbff;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);padding:3px 9px;border-radius:10px">${esc(t)}</span>`).join('')}</div>
    </div>
    ${ext?`<div class="section-title"><span class="bar"></span>要点速览</div>${extHtml}`:''}
    <div class="section-title"><span class="bar"></span>飞书原文</div>
    <div class="list-item" onclick="openFeishu('${r.url}')">
      <div class="li-ico purple">${ICONS.doc}</div>
      <div class="li-main"><div class="li-title">${esc(r.name)} · 飞书原文</div><div class="li-desc">在飞书文档中查看完整内容</div></div>
      <div class="li-arrow">${ICONS.arrow}</div>
    </div>
    <div class="foot-note">内容来自飞书工作台 · 准实时同步</div>
  `;
  switchView('detail');
}

/* ===== 图片查看器 ===== */
function openViewer(src,cap){
  const v=$('#viewer');
  $('#viewer-img').src=src;
  $('#viewer-cap').textContent=cap||'';
  v.classList.add('open');
}

/* ===== 路由 ===== */
function router(){
  const {path}=hashQuery();
  const valid=['home','business','flow','qa','data'];
  let p=path||'home';
  if(path==='detail'){renderDetail();return}
  if(!valid.includes(p))p='home';
  switchView(p);
  if(p==='home')renderHome();
  else if(p==='business')renderBusiness();
  else if(p==='flow')renderFlow();
  else if(p==='qa')renderQA();
  else if(p==='data')renderData();
  // 同步头部标题
  const titles={home:'购机通 · 团队工作台',business:'业务模式',flow:'线下国补流程',qa:'常见问答',data:'数据看板'};
  $('#header-title').textContent=titles[p]||'购机通';
}
window.addEventListener('hashchange',router);
window.addEventListener('DOMContentLoaded',()=>{
  if(!location.hash)location.hash='#home';
  else router();
});

/* ===== 本地数据桥：自动刷新 ===== */
(function(){
  var curVer = (DATA && DATA.generated) || '';
  function poll(){
    fetch('/api/version', {cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
      if(d && d.ok && d.version && d.version !== curVer){
        curVer = d.version;
        setTimeout(function(){location.reload()}, 300);
      }
    }).catch(function(){ /* 非桥接环境（直接打开文件）静默 */ });
  }
  if(location.protocol==='http:' || location.protocol==='https:'){
    setTimeout(poll, 2500);
    setInterval(poll, 15000);
  }
})();
